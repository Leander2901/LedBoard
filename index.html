<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snowboard LEDs</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151921;
      --border: #232936;
      --accent: #00f0ff;
      --text: #f0f4f8;
      --sub: #8692a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 14px;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .header h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }
    .btn-ble {
      background: #1e2430;
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-ble.connected { border-color: #2ea043; color: #3fb950; background: rgba(46,160,67,0.15); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ea4335; }
    .connected .dot { background: #3fb950; }

    /* Visualizer Container - 20% verkleind via zoom/scale */
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 345px; /* Compacte viewport */
      margin-bottom: 6px;
    }
    .board-wrapper {
      transform: scale(0.8); /* 20% verkleind */
      transform-origin: center center;
    }
    .snowboard {
      position: relative;
      width: 88px;   /* Slanker */
      height: 410px; /* Langere ratio */
      background: linear-gradient(180deg, #1c212a 0%, #0d1117 50%, #1c212a 100%);
      border-radius: 36px / 75px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 0 1.5px rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      padding: 16px 5px;
    }
    .binding {
      position: absolute;
      left: 50%;
      width: 44px;
      height: 28px;
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.08);
      border-radius: 6px;
      transform: translateX(-50%);
    }
    .binding.front { top: 95px; transform: translateX(-50%) rotate(-12deg); }
    .binding.back  { bottom: 95px; transform: translateX(-50%) rotate(6deg); }

    .led-strip {
      width: 5px;
      height: 100%;
      display: flex;
      flex-direction: column-reverse; /* 0 onderaan, 59 bovenaan */
      justify-content: space-between;
      z-index: 2;
    }
    .pixel {
      width: 4px;
      height: 3px;
      background: #000;
      border-radius: 1px;
      box-shadow: 0 0 4px transparent;
    }

    /* Controls Drawer */
    .panel {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Mode Selection Tabs (Clone vs Split) */
    .tab-bar {
      display: flex;
      background: #0d1117;
      border-radius: 10px;
      padding: 3px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 7px 0;
      font-size: 0.78rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--sub);
      border-radius: 7px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #212631;
      color: var(--text);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .label { font-size: 0.8rem; color: var(--sub); font-weight: 500; }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 5px;
      background: #232936;
      border-radius: 3px;
    }

    .color-picker-box {
      width: 38px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .color-picker-box input {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      cursor: pointer;
      border: none;
    }

    .modes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn-mode {
      background: #1b202a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-mode.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,240,255,0.08);
    }
    .btn-off {
      background: rgba(234,67,53,0.12);
      border: 1px solid rgba(234,67,53,0.3);
      color: #ff6b6b;
      padding: 8px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏂 Board Controller</h1>
    <button class="btn-ble" id="bleBtn" onclick="connectBLE()">
      <div class="dot"></div>
      <span id="bleStatus">Verbinden</span>
    </button>
  </div>

  <div class="stage">
    <div class="board-wrapper">
      <div class="snowboard">
        <div class="binding front"></div>
        <div class="binding back"></div>
        <div class="led-strip" id="stripL"></div>
        <div class="led-strip" id="stripR"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <!-- Split / Clone Selector -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabClone" onclick="setTarget(0)">🔗 Clone (Beide)</button>
      <button class="tab-btn" id="tabLeft" onclick="setTarget(1)">L-Zijde</button>
      <button class="tab-btn" id="tabRight" onclick="setTarget(2)">R-Zijde</button>
    </div>

    <!-- Modus Knoppen -->
    <div class="modes-grid">
      <button class="btn-mode active" id="m0" onclick="selectMode(0)">Vast</button>
      <button class="btn-mode" id="m1" onclick="selectMode(1)">🌈 Rainbow</button>
      <button class="btn-mode" id="m2" onclick="selectMode(2)">☄️ Strepen</button>
    </div>

    <!-- Helderheid & Kleur -->
    <div class="row">
      <span class="label">Helderheid</span>
      <input type="range" id="bright" min="0" max="255" value="150" oninput="syncSettings()">
      <div class="color-picker-box">
        <input type="color" id="picker" value="#00f0ff" onchange="syncSettings()">
      </div>
    </div>

    <!-- Comet Opties (Dynamisch) -->
    <div id="cometSettings" style="display: none; flex-direction: column; gap: 8px;">
      <div class="row">
        <span class="label">Snelheid</span>
        <input type="range" id="speed" min="10" max="100" value="50" oninput="syncSettings()">
      </div>
      <div class="row">
        <span class="label">Lengte</span>
        <input type="range" id="tail" min="4" max="30" value="14" oninput="syncSettings()">
      </div>
    </div>

    <button class="btn-off" onclick="turnOff()">Leds Uitschakelen</button>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let ledChar = null;

    // DOM Leds opbouwen
    const stripLEl = document.getElementById("stripL");
    const stripREl = document.getElementById("stripR");
    const ledsL = [], ledsR = [];

    for (let i = 0; i < 60; i++) {
      const dL = document.createElement("div");
      dL.className = "pixel";
      stripLEl.appendChild(dL);
      ledsL.push(dL);

      const dR = document.createElement("div");
      dR.className = "pixel";
      stripREl.appendChild(dR);
      ledsR.push(dR);
    }

    // State per zijde
    let currentTarget = 0; // 0=Clone, 1=Left, 2=Right
    let sideL = { mode: 0, r: 0, g: 240, b: 255, speed: 50, tail: 14 };
    let sideR = { mode: 0, r: 0, g: 240, b: 255, speed: 50, tail: 14 };
    let brightness = 150;

    function setTarget(t) {
      currentTarget = t;
      document.getElementById("tabClone").classList.toggle("active", t === 0);
      document.getElementById("tabLeft").classList.toggle("active", t === 1);
      document.getElementById("tabRight").classList.toggle("active", t === 2);

      // UI updaten naar de actieve selectie
      const active = t === 2 ? sideR : sideL;
      selectMode(active.mode, false);
      document.getElementById("speed").value = active.speed;
      document.getElementById("tail").value = active.tail;
      document.getElementById("picker").value = rgbToHex(active.r, active.g, active.b);
    }

    function selectMode(m, shouldSync = true) {
      [0, 1, 2].forEach(i => document.getElementById(`m${i}`).classList.toggle("active", i === m));
      document.getElementById("cometSettings").style.display = (m === 2) ? "flex" : "none";
      if (shouldSync) syncSettings(m);
    }

    function turnOff() {
      selectMode(3);
    }

    function syncSettings(overrideMode = null) {
      brightness = parseInt(document.getElementById("bright").value);
      const hex = document.getElementById("picker").value;
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      const spd = parseInt(document.getElementById("speed").value);
      const tail = parseInt(document.getElementById("tail").value);

      const apply = (cfg) => {
        if (overrideMode !== null) cfg.mode = overrideMode;
        cfg.r = r; cfg.g = g; cfg.b = b;
        cfg.speed = spd; cfg.tail = tail;
      };

      if (currentTarget === 0 || currentTarget === 1) apply(sideL);
      if (currentTarget === 0 || currentTarget === 2) apply(sideR);

      // Verzend naar BLE
      const active = (currentTarget === 2) ? sideR : sideL;
      sendBLE(active.mode, active.r, active.g, active.b, brightness, active.speed, active.tail, currentTarget);
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    /* Render Lus voor realistische 2D visualizer */
    function wheel(pos) {
      pos = 255 - pos;
      if (pos < 85) return [255 - pos * 3, 0, pos * 3];
      if (pos < 170) { pos -= 85; return [0, pos * 3, 255 - pos * 3]; }
      pos -= 170; return [pos * 3, 255 - pos * 3, 0];
    }

    function renderVirtual(ledArray, cfg, now) {
      const bScale = brightness / 255;
      if (cfg.mode === 3) {
        ledArray.forEach(el => { el.style.background = "#000"; el.style.boxShadow = "none"; });
        return;
      }
      if (cfg.mode === 0) {
        const col = `rgb(${cfg.r * bScale},${cfg.g * bScale},${cfg.b * bScale})`;
        const glow = `rgba(${cfg.r},${cfg.g},${cfg.b},${0.6 * bScale})`;
        ledArray.forEach(el => {
          el.style.background = col;
          el.style.boxShadow = `0 0 5px ${glow}`;
        });
        return;
      }
      if (cfg.mode === 1) {
        const offset = (now * cfg.speed * 0.01) % 256;
        for (let i = 0; i < 60; i++) {
          const hue = Math.floor(i * 256 / 60 + offset) & 0xFF;
          const [r, g, b] = wheel(hue);
          ledArray[i].style.background = `rgb(${r * bScale},${g * bScale},${b * bScale})`;
          ledArray[i].style.boxShadow = `0 0 4px rgba(${r},${g},${b},${0.5 * bScale})`;
        }
        return;
      }
      if (cfg.mode === 2) {
        ledArray.forEach(el => { el.style.background = "#000"; el.style.boxShadow = "none"; });
        const head = ((now * (cfg.speed * 0.002)) % (60 + cfg.tail));
        // Van voor (59) naar achter (0)
        const headIdx = 59 - Math.floor(head) + cfg.tail;

        for (let t = 0; t < cfg.tail; t++) {
          const idx = headIdx + t;
          if (idx >= 0 && idx < 60) {
            const fade = (1.0 - (t / cfg.tail)) * bScale;
            ledArray[idx].style.background = `rgb(${cfg.r * fade},${cfg.g * fade},${cfg.b * fade})`;
            ledArray[idx].style.boxShadow = `0 0 6px rgba(${cfg.r},${cfg.g},${cfg.b},${fade})`;
          }
        }
      }
    }

    function animate() {
      const now = performance.now();
      renderVirtual(ledsL, sideL, now);
      renderVirtual(ledsR, sideR, now);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    /* BLE Verbinding */
    async function connectBLE() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Snowboard-LED" }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        ledChar = await service.getCharacteristic(CHAR_UUID);

        document.getElementById("bleBtn").classList.add("connected");
        document.getElementById("bleStatus").innerText = "Verbonden";
        syncSettings();
      } catch (err) {
        console.error("BLE Error:", err);
      }
    }

    async function sendBLE(mode, r, g, b, bright, speed, tail, target) {
      if (!ledChar) return;
      try {
        const data = new Uint8Array([mode, r, g, b, bright, speed, tail, target]);
        await ledChar.writeValue(data);
      } catch (e) {
        console.error("Verzendfout:", e);
      }
    }
  </script>
</body>
</html>
