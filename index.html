<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snowboard LED Controller</title>
  <style>
    :root {
      --led-color: #00f0ff;
      --led-glow: rgba(0, 240, 255, 0.7);
      --bg-color: #0c0f14;
      --card-bg: #161b22;
      --accent: #238636;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 16px;
      overflow-x: hidden;
    }

    /* Bovenbalk */
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }

    .btn-connect {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-connect.connected {
      background: rgba(35, 134, 54, 0.2);
      border-color: #2ea043;
      color: #3fb950;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #da3633;
    }

    .connected .status-dot { background: #3fb950; }

    /* Snowboard Stage */
    .stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 420px;
      padding: 10px 0;
    }

    /* 2D Snowboard */
    .snowboard {
      position: relative;
      width: 150px;
      height: 480px;
      background: linear-gradient(180deg, #1b2028 0%, #111419 50%, #1b2028 100%);
      border-radius: 42px / 75px; /* Typische snowboard tip & tail afronding */
      box-shadow: 
        0 15px 35px rgba(0,0,0,0.8),
        inset 0 0 0 2px rgba(255,255,255,0.06),
        inset 0 0 15px rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-between;
      padding: 24px 8px; /* Ruimte tot de rand */
    }

    /* Subtiele taillering (sidecut) */
    .snowboard::before {
      content: "";
      position: absolute;
      top: 15%;
      bottom: 15%;
      left: -4px;
      right: -4px;
      border-left: 3px solid rgba(255,255,255,0.05);
      border-right: 3px solid rgba(255,255,255,0.05);
      pointer-events: none;
    }

    /* Bindingsindicatie voor realisme */
    .binding {
      position: absolute;
      left: 50%;
      width: 58px;
      height: 42px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .binding.front { top: 120px; transform: translateX(-50%) rotate(-12deg); }
    .binding.back  { bottom: 120px; transform: translateX(-50%) rotate(5deg); }

    /* Ledstrips links & rechts */
    .led-strip {
      width: 6px;
      height: 100%;
      display: flex;
      flex-direction: column-reverse; /* Onder (index 0) naar boven (index 59) */
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* De individuele 60 lampjes */
    .pixel {
      width: 5px;
      height: 4px;
      background-color: var(--led-color);
      border-radius: 1px;
      box-shadow: 
        0 0 4px var(--led-color),
        0 0 8px var(--led-glow),
        0 0 14px var(--led-glow);
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Bedieningspaneel onderaan */
    .control-panel {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Directe kleurkiezer & snelle presets */
    .color-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-picker-wrapper {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #30363d;
      flex-shrink: 0;
    }

    .color-picker-wrapper input[type="color"] {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      cursor: pointer;
      border: none;
    }

    .presets {
      display: flex;
      gap: 8px;
      flex: 1;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .preset-dot {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Placeholder voor toekomstige lichtmodi */
    .mode-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .mode-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 12px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .mode-btn:active {
      transform: scale(0.97);
      background: #30363d;
    }

    .mode-btn.off {
      grid-column: span 2;
      background: rgba(218, 54, 51, 0.15);
      border-color: rgba(218, 54, 51, 0.4);
      color: #f85149;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>🏂 Board LEDs</h1>
    <button class="btn-connect" id="connectBtn" onclick="connectBLE()">
      <div class="status-dot"></div>
      <span id="connectText">Koppelen</span>
    </button>
  </div>

  <!-- Snowboard Stage -->
  <div class="stage">
    <div class="snowboard">
      <div class="binding front"></div>
      <div class="binding back"></div>

      <!-- Links: 60 leds (0 - 59) -->
      <div class="led-strip" id="stripLeft"></div>

      <!-- Rechts: 60 leds (0 - 59) -->
      <div class="led-strip" id="stripRight"></div>
    </div>
  </div>

  <!-- Bedieningspaneel -->
  <div class="control-panel">
    <div class="panel-header">
      <span>Kleur & Visualizer</span>
    </div>

    <div class="color-row">
      <div class="color-picker-wrapper">
        <input type="color" id="colorPicker" value="#00f0ff" onchange="handleColorInput(this.value)">
      </div>
      <div class="presets">
        <button class="preset-dot" style="background: #ff0055;" onclick="handleColorInput('#ff0055')"></button>
        <button class="preset-dot" style="background: #00f0ff;" onclick="handleColorInput('#00f0ff')"></button>
        <button class="preset-dot" style="background: #00ff66;" onclick="handleColorInput('#00ff66')"></button>
        <button class="preset-dot" style="background: #ffaa00;" onclick="handleColorInput('#ffaa00')"></button>
      </div>
    </div>

    <div class="panel-header" style="margin-top: 4px;">
      <span>Lichtmodi (Binnenkort)</span>
    </div>

    <div class="mode-container">
      <button class="mode-btn" onclick="alert('Modus volgt in volgende stap!')">🌈 Regenboog</button>
      <button class="mode-btn" onclick="alert('Modus volgt in volgende stap!')">⚡ Stroboscoop</button>
      <button class="mode-btn" onclick="alert('Modus volgt in volgende stap!')">🌊 Ademend</button>
      <button class="mode-btn" onclick="alert('Modus volgt in volgende stap!')">🏎️ Looplicht</button>
      <button class="mode-btn off" onclick="handleColorInput('#000000')">Uitschakelen</button>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let ledChar = null;

    // Genereer 60 leds aan weerszijden in DOM
    const stripLeft = document.getElementById("stripLeft");
    const stripRight = document.getElementById("stripRight");

    for (let i = 0; i < 60; i++) {
      const pL = document.createElement("div");
      pL.className = "pixel";
      pL.id = `led-l-${i}`;
      stripLeft.appendChild(pL);

      const pR = document.createElement("div");
      pR.className = "pixel";
      pR.id = `led-r-${i}`;
      stripRight.appendChild(pR);
    }

    // Update de 2D visualizer direct
    function updateVisualizer(hexColor) {
      document.documentElement.style.setProperty('--led-color', hexColor);
      
      // Bereken transparante gloedkleur
      if (hexColor === '#000000') {
        document.documentElement.style.setProperty('--led-glow', 'transparent');
      } else {
        const r = parseInt(hexColor.slice(1, 3), 16);
        const g = parseInt(hexColor.slice(3, 5), 16);
        const b = parseInt(hexColor.slice(5, 7), 16);
        document.documentElement.style.setProperty('--led-glow', `rgba(${r}, ${g}, ${b}, 0.7)`);
      }
    }

    function handleColorInput(hex) {
      updateVisualizer(hex);

      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      sendColor(r, g, b);
    }

    async function connectBLE() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Snowboard-LED" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        ledChar = await service.getCharacteristic(CHAR_UUID);

        document.getElementById("connectBtn").classList.add("connected");
        document.getElementById("connectText").innerText = "Verbonden";
      } catch (err) {
        console.error("BLE Fout:", err);
      }
    }

    async function sendColor(r, g, b) {
      if (!ledChar) return;
      try {
        const data = new Uint8Array([r, g, b]);
        await ledChar.writeValue(data);
      } catch (err) {
        console.error("Verzendfout:", err);
      }
    }
  </script>
</body>
</html>
